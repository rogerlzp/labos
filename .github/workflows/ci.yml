name: CI

# M8 门禁：把"改完有没有坏"从"记得测一下"变成必须过。
# 这里只跑**不需要数据库**的部分（纯逻辑单测 + 前端类型），
# 设备链路和 e2e 要模拟器/前端在跑，放在本地 ./scripts/ci-gate.sh --all。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependity-path: webapp/package-lock.json

      # sidecar 是 .NET 程序（目标框架 net10.0），runner 镜像预装的 SDK
      # 不保证满足这个版本 —— 缺版本时 test-sidecar.sh 会跳过，
      # 于是 CI 上最关键的「中控 → sidecar → 模拟器」链路等于没被测过。
      # 显式装 10.x，把这条链路真正纳入 CI 覆盖。
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 编译内核
        working-directory: labos-kernel
        run: |
          javac -encoding UTF-8 -d out -cp "out:lib/postgresql-42.7.3.jar" \
            $(find src/main -name '*.java')

      - name: 前端依赖
        working-directory: webapp
        run: npm ci

      - name: 门禁（纯逻辑 536 + tsc）
        run: ./scripts/ci-gate.sh
