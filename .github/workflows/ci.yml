name: CI

# M8 门禁：把"改完有没有坏"从"记得测一下"变成必须过。
# 这里只跑**不需要数据库**的部分（纯逻辑单测 + 前端类型），
# 设备链路和 e2e 要模拟器/前端在跑，放在本地 ./scripts/ci-gate.sh --all。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 诊断：setup-node 的 npm 缓存步骤会去解析 lock 文件，解析不到就直接
      # 失败（报错只说"lock file is not found"，看不出缺的是哪个路径）。
      # 这一步把实际状态打出来 —— 文件在不在、有没有被 git 跟踪、
      # 会不会被 .gitignore 挡掉，一次看清。
      - name: 诊断 lock 文件
        run: |
          pwd
          ls -la webapp/package-lock.json || echo "MISSING: webapp/package-lock.json"
          git ls-files webapp/package-lock.json
          git check-ignore -v webapp/package-lock.json || echo "(未被 gitignore 忽略)"

      - name: 安装 Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # 用 glob 而不是单个相对路径：lock 文件在 webapp/ 子目录，
          # 单路径写法在某些 action 版本下解析不到而静默跳过缓存。
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # sidecar 是 .NET 程序（目标框架 net10.0），runner 镜像预装的 SDK
      # 不保证满足这个版本 —— 缺版本时 test-sidecar.sh 会跳过，
      # 于是 CI 上最关键的「中控 → sidecar → 模拟器」链路等于没被测过。
      # 显式装 10.x，把这条链路真正纳入 CI 覆盖。
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 编译内核
        working-directory: labos-kernel
        run: |
          javac -encoding UTF-8 -d out -cp "out:lib/postgresql-42.7.3.jar" \
            $(find src/main -name '*.java')

      - name: 前端依赖
        working-directory: webapp
        run: npm ci

      - name: 门禁（纯逻辑 536 + tsc）
        run: ./scripts/ci-gate.sh
