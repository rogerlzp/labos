<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>设备管理台 · sidecar</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b35; --fg:#e6e9ef; --dim:#9aa4b2;
    --ok:#3fb950; --off:#6e7681; --warn:#d29922; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  button{background:#21262d;color:var(--fg);border:1px solid var(--line);
         border-radius:6px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover:not(:disabled){border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
  button.danger:hover{border-color:#f85149;color:#ff7b72}
  main{padding:20px 24px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{background:#1c2029;color:var(--dim);font-weight:600;font-size:12px;
     text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#1b1f27}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .dot.on{background:var(--ok);box-shadow:0 0 7px rgba(63,185,80,.55)}
  .dot.off{background:var(--off)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .tag{display:inline-block;padding:1px 8px;border-radius:11px;font-size:11.5px;
       background:#21262d;border:1px solid var(--line);color:var(--dim)}
  .note{color:var(--warn);font-size:12px}
  .msg{margin:0 24px 14px;padding:9px 13px;border-radius:6px;font-size:13px;display:none}
  .msg.ok{display:block;background:#12331c;border:1px solid #2ea043;color:#7ee787}
  .msg.err{display:block;background:#3d1d1d;border:1px solid #f85149;color:#ff7b72}
  .empty{padding:36px;text-align:center;color:var(--dim)}
  .foot{padding:14px 24px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>设备管理台</h1>
  <span class="sub" id="meta">加载中…</span>
  <span class="spacer"></span>
  <button onclick="bulk('start-all')">全部上线</button>
  <button class="danger" onclick="bulk('stop-all')">全部下线</button>
  <button onclick="load()">刷新</button>
</header>

<p class="msg" id="msg"></p>

<main>
  <table>
    <thead>
      <tr>
        <th style="width:130px">状态</th>
        <th>设备名称</th>
        <th style="width:110px">设备ID</th>
        <th style="width:180px">设备IP</th>
        <th style="width:90px">端口</th>
        <th style="width:130px">能力</th>
        <th style="width:160px">进程</th>
        <th style="width:170px">操作</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">中控清单里没有设备</div>
</main>

<div class="foot">
  设备清单来自中控（唯一真源）；在线状态来自 Redis（唯一权威）。
  「上线」= 起一个 tcp client 维持到设备的<b>长连接</b>并上报 Redis；
  「下线」= 停掉它，Redis 状态过期后中控即判这台设备离线。
</div>

<script>
let rows = [];

async function load(){
  try{
    const r = await fetch('/api/devices');
    if(!r.ok){ throw new Error(await r.text()); }
    const d = await r.json();
    rows = d.devices || [];
    document.getElementById('meta').textContent =
      `中控清单 ${d.registryUrl} · Redis ${d.redis} · 共 ${rows.length} 台`;
    render();
  }catch(e){
    say('读取设备列表失败：'+e.message, false);
  }
}

function render(){
  const tb = document.getElementById('rows');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  tb.innerHTML = rows.map(d => `
    <tr>
      <td><span class="dot ${d.online ? 'on' : 'off'}"></span>${d.online ? '在线' : '离线'}</td>
      <td><b>${esc(d.name||d.code)}</b><div class="note">${esc(d.note||'')}</div></td>
      <td class="mono">${d.deviceId}</td>
      <td class="mono">${esc(d.ip)}</td>
      <td class="mono">${d.port}</td>
      <td><span class="tag">${esc(d.capability||'-')}</span></td>
      <td class="mono">${d.managed ? 'pid '+d.pid : '-'}</td>
      <td>
        <button class="primary" ${d.managed?'disabled':''} onclick="act(${d.deviceId},'start')">上线</button>
        <button class="danger" ${d.managed?'':'disabled'} onclick="act(${d.deviceId},'stop')">下线</button>
      </td>
    </tr>`).join('');
}

async function act(id, what){
  say('处理中…', true);
  try{
    const r = await fetch(`/api/devices/${id}/${what}`, {method:'POST'});
    const j = await r.json();
    say(j.message || (what==='start'?'已上线':'已下线'), j.ok !== false);
  }catch(e){ say('操作失败：'+e.message, false); }
  setTimeout(load, 800);
}

async function bulk(what){
  say('处理中…', true);
  try{
    const r = await fetch(`/api/devices/${what}`, {method:'POST'});
    const j = await r.json();
    const extra = (j.errors && j.errors.length) ? '（部分失败：'+j.errors.join('；')+'）' : '';
    say(`${what==='start-all'?'已上线':'已下线'} ${j.started ?? j.stopped} 台${extra}`, true);
  }catch(e){ say('操作失败：'+e.message, false); }
  setTimeout(load, 1500);
}

function say(text, ok){
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
setInterval(load, 5000);   // 在线状态每 5 秒自己刷新，不用手动点
</script>
</body>
</html>
