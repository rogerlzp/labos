<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- 9608 加液（分液）设备：喷头横梁 + A/B 双板位 + 试剂瓶 + 管路。示意图。
       与 PAUTO.svg 同一套线稿语言，只换主题色与内部构造。 -->
  <rect width="320" height="200" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="0" y="0" width="320" height="8" rx="4" fill="#10b981"/>

  <g stroke="#10b981" fill="none" stroke-width="5" stroke-linejoin="round">
    <!-- 机箱 -->
    <rect x="44" y="40" width="200" height="112" rx="10" stroke-width="7"/>
    <!-- 喷头横梁 -->
    <rect x="64" y="56" width="160" height="14" rx="5" fill="#d1fae5" stroke-width="4"/>
    <!-- 四路喷嘴 + 滴液 -->
    <path d="M84 70 V88 M124 70 V88 M164 70 V88 M204 70 V88" stroke-linecap="round" stroke-width="4"/>
    <circle cx="84" cy="94" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="124" cy="94" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="164" cy="94" r="3.5" fill="#10b981" stroke="none"/>
    <circle cx="204" cy="94" r="3.5" fill="#10b981" stroke="none"/>
    <!-- A / B 两个板位 -->
    <rect x="66" y="110" width="66" height="30" rx="4" stroke-width="4"/>
    <rect x="156" y="110" width="66" height="30" rx="4" stroke-width="4"/>
    <!-- 试剂瓶 + 管路 -->
    <path d="M244 58 h24 a6 6 0 0 1 6 6 v54 a6 6 0 0 1 -6 6 h-24 z" stroke-width="4"/>
    <path d="M250 58 V44 h12 v14" stroke-width="4"/>
    <path d="M244 96 H226" stroke-width="4" stroke-dasharray="6 4"/>
  </g>

  <!-- 板位孔阵标记（只看得出"这是孔板位"，不画 96 个孔） -->
  <g fill="#10b981" stroke="none">
    <circle cx="78" cy="125" r="2.5"/><circle cx="92" cy="125" r="2.5"/><circle cx="106" cy="125" r="2.5"/><circle cx="120" cy="125" r="2.5"/>
    <circle cx="78" cy="133" r="2.5"/><circle cx="92" cy="133" r="2.5"/><circle cx="106" cy="133" r="2.5"/><circle cx="120" cy="133" r="2.5"/>
    <circle cx="168" cy="125" r="2.5"/><circle cx="182" cy="125" r="2.5"/><circle cx="196" cy="125" r="2.5"/><circle cx="210" cy="125" r="2.5"/>
    <circle cx="168" cy="133" r="2.5"/><circle cx="182" cy="133" r="2.5"/><circle cx="196" cy="133" r="2.5"/><circle cx="210" cy="133" r="2.5"/>
  </g>
  <text x="99" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">A 板位</text>
  <text x="189" y="156" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748B">B 板位</text>

  <text x="160" y="176" text-anchor="middle" font-family="sans-serif" font-size="16"
        font-weight="bold" fill="#334155">加液分液设备</text>
  <text x="160" y="193" text-anchor="middle" font-family="sans-serif" font-size="10"
        fill="#94A3B8">9608 · ALIQUOT · 示意圖</text>
</svg>
